name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run billing:check -- --base "$BILLING_REVIEW_BASE"
        env:
          BILLING_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run check
      - run: npm run test:workspace
      - run: npm run test:recovery
      - run: npm run test:bridge
      - run: npm run test:multiplayer
  sandbox-image:
    # Public runner image test only: no Cloudflare token, application or paid sandbox.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/test-sandbox-image.sh
